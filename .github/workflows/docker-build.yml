# Builds the album-guard container image on tag pushes or manual dispatch.
# No registry push by default — enable once a registry/login step is wired up.
name: Docker build (album-guard)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./album-guard
          file: ./album-guard/Dockerfile
          push: false
          # Commit SHA instead of ref_name: branch names like auto/x contain '/', which is
          # not valid in a Docker tag (manual runs from branches would fail).
          tags: |
            album-guard:${{ github.sha }}
            album-guard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

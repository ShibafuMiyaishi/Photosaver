# Lint + unit tests for the Node components on pushes to main and PRs into main.
# Note: hashFiles() is only allowed inside steps (not in jobs.<id>.if). Using it at job
# level makes GitHub reject the whole file ("workflow file issue", zero jobs run).
name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  album-guard:
    # Frozen component: keep its original runtime (Node 20, matches its Dockerfile).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: album-guard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: album-guard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present
        env:
          GUARD_JWT_SECRET: ci-test-secret-do-not-use-in-production-0000000000000000

  guest-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: guest-gateway
    steps:
      - uses: actions/checkout@v7

      # Lets this workflow land on main before guest-gateway/ itself does.
      - name: Detect guest-gateway
        id: detect
        working-directory: .
        run: echo "present=${{ hashFiles('guest-gateway/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: guest-gateway/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci --ignore-scripts

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.detect.outputs.present == 'true'
        run: npm test

# server/docker-compose.yml
# Photosaver v2 — 専用 Linux ミニ PC(Ubuntu Server 24.04)向け本番スタック。
# ベース: Immich 公式 docker-compose.yml (releases/latest) + 本プロジェクト向け調整。
#
# 公式からの変更点:
#   1. ports を 127.0.0.1 バインドに変更(公開は tailscale serve が担う)
#   2. mount-guard サービス追加(写真 HDD 未マウント時に起動を止める)
#   3. QSV ハードウェアトランスコード有効化(hwaccel.transcoding.yml が必要 —
#      docs/new-server-setup.md の手順でダウンロードする)
#   4. DB_STORAGE_TYPE は未設定(DB は内蔵 NVMe に置く前提)
#
# 起動前に必ず: cp .env.example .env して値を埋める。
# セットアップ全体: docs/new-server-setup.md / 移行: docs/migration-runbook.md

name: photosaver

services:
  # 写真 HDD が正しくマウントされている場合のみ本体を起動するガード。
  # /mnt/photo(HDD)直下のマーカーファイルを確認する。HDD が外れていると
  # bind mount は「空のディレクトリ」を掴んで Immich が壊れたデータを書くため、
  # ここで fail-fast させる(旧 album-guard 不変条件 4 の後継)。
  mount-guard:
    container_name: photosaver_mount_guard
    image: busybox:1.36
    command: ['sh', '-c', 'test -f /data/.photosaver.mount-ok || (echo "FATAL: photo drive not mounted (marker missing)"; exit 1)']
    volumes:
      - ${UPLOAD_LOCATION}:/data:ro
    restart: 'no'

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    extends:
      file: hwaccel.transcoding.yml
      service: quicksync # Intel QSV(i5-9500T / UHD 630)。無効化するなら extends ごとコメントアウト
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # tailscale serve → localhost:2283 で公開するため、ローカルバインドのみ。
      - '127.0.0.1:2283:2283'
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
      mount-guard:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # CPU 推論で運用開始する(16GB RAM で安定)。OpenVINO を試す場合は
    # イメージタグに -openvino を付け、hwaccel.ml.yml の openvino を extends する。
    # 注意: iGPU の OpenVINO は不安定報告あり — docs/operations.md 参照。
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    # extends:
    #   file: hwaccel.ml.yml
    #   service: openvino
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:

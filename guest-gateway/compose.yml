# guest-gateway/compose.yml
# ゲスト用アップロード窓口。ミニPC本体とは別の Tailscale ノード(tag:wedding-gw)として
# Funnel で公開する。server/docker-compose.yml(Immich 本体)とは別プロジェクト。
#
# 起動(ミニPC、手順は guest-gateway/README.md):
#   docker compose -f /srv/photosaver/repo/guest-gateway/compose.yml \
#     --env-file /srv/photosaver/guest-gateway/.env up -d --build
# 緊急停止:
#   docker compose -p wedding-gw down
#   (ミニPC本体で tailscale funnel reset / serve reset は使わない — Immich の tailnet 公開も消える)
#
# Immich へは本体 compose が作る内部ネットワーク photosaver_gw 経由で接続する(immich-server だけが
# 参加。Redis・Postgres には届かない)。Immich を先に起動しておくこと。
# イベント用の IMMICH_* は scripts/setup-event.js が書き出す ${GW_DATA_DIR}/immich.env から読む。
# このファイルが無ければ速度検証モード(受信して削除するだけ)。

name: wedding-gw

services:
  ts:
    image: tailscale/tailscale:v1.102
    container_name: guest_gateway_ts
    hostname: ${TS_HOSTNAME:-guest-upload}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY is required}
      TS_HOSTNAME: ${TS_HOSTNAME:-guest-upload}
      TS_EXTRA_ARGS: --advertise-tags=tag:wedding-gw
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking (the image default): the gateway cannot dial tailnet peers.
      TS_USERSPACE: 'true'
    volumes:
      - ${GW_DATA_DIR:?GW_DATA_DIR is required}/ts-state:/var/lib/tailscale
      # TS_SERVE_CONFIG must be mounted as a directory, not a single file.
      - ./ts-config:/config:ro
    # The gateway shares this network namespace, so these are the gateway's networks too:
    # default (internet egress for Tailscale) + photosaver_gw (immich-server only).
    networks:
      - default
      - immich
    restart: unless-stopped

  guest-gateway:
    build: .
    container_name: guest_gateway
    # Share the sidecar's network namespace; tailscale serve proxies to 127.0.0.1:8080.
    network_mode: service:ts
    depends_on:
      - ts
    environment:
      HOST: 127.0.0.1
      PORT: '8080'
      STAGING_DIR: /data/staging
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GUEST_PASSWORD_HASH: ${GUEST_PASSWORD_HASH:?GUEST_PASSWORD_HASH is required}
      CLOSES_AT: ${CLOSES_AT:?CLOSES_AT is required}
      MAX_FILE_GB: ${MAX_FILE_GB:-4}
      MIN_FREE_GB: ${MIN_FREE_GB:-10}
      KEEP_UPLOADS: ${KEEP_UPLOADS:-false}
      MOUNT_MARKER: /run/photosaver/mount-ok
      IMMICH_URL: http://immich-server:2283
      DB_PATH: /data/db/gateway.db
    # IMMICH_SHARE_KEY / IMMICH_ALBUM_ID / IMMICH_DELETE_API_KEY (secrets, mode 600).
    env_file:
      - path: ${GW_DATA_DIR:?GW_DATA_DIR is required}/immich.env
        required: false
    volumes:
      # Upload records (small sqlite on the NVMe). Create it owned by uid 1000 beforehand.
      - type: bind
        source: ${GW_DATA_DIR:?GW_DATA_DIR is required}/db
        target: /data/db
        bind:
          create_host_path: false
      # HDD mount marker (exists only on the mounted HDD). Startup fails if it is missing,
      # and the app re-checks it before accepting each upload.
      - type: bind
        source: ${MOUNT_MARKER_HOST:-/mnt/photo/.photosaver.mount-ok}
        target: /run/photosaver/mount-ok
        read_only: true
        bind:
          create_host_path: false
      # Photo HDD. create_host_path: false makes startup fail (instead of writing to the
      # system disk) when the HDD is not mounted and the directory does not exist.
      - type: bind
        source: ${STAGING_DIR_HOST:?STAGING_DIR_HOST is required}
        target: /data/staging
        bind:
          create_host_path: false
    restart: unless-stopped

networks:
  immich:
    external: true
    name: photosaver_gw

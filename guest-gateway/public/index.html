<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>写真アップロード</title>
    <link rel="stylesheet" href="/vendor/photoswipe/photoswipe.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>写真・動画アップロード</h1>

      <section id="login" hidden>
        <form id="login-form">
          <label for="nickname">ニックネーム(誰が撮ったか分かるように)</label>
          <input id="nickname" name="nickname" type="text" autocomplete="nickname" required />
          <label for="password">合言葉</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit">入る</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="uploader" hidden>
        <p id="greeting" class="greeting"></p>

        <nav id="tabs" class="tabs" hidden>
          <button id="tab-upload" type="button" class="tab" aria-pressed="true">
            アップロード
          </button>
          <button id="tab-gallery" type="button" class="tab" aria-pressed="false">
            みんなの写真
          </button>
        </nav>

        <div id="upload-pane">
          <p class="notice" role="status">
            アップロード中は<strong>この画面を開いたまま</strong>にしてください。<br />
            画面を閉じたり別のアプリに切り替えると一時停止し、戻ると続きから再開します。
          </p>

          <label class="pick">
            写真・動画を選ぶ
            <input id="files" type="file" accept="image/*,video/*" multiple />
          </label>

          <p id="summary" class="summary"></p>
          <ul id="queue" class="queue"></ul>

          <details class="diag">
            <summary>計測情報</summary>
            <p id="whoami">-</p>
            <p id="closes-at">-</p>
          </details>
        </div>

        <div id="gallery" hidden>
          <div class="gallery-bar">
            <span id="gallery-count"></span>
            <span id="gallery-status" role="status"></span>
            <button
              id="gallery-bulk"
              type="button"
              class="small"
              aria-controls="bulk"
              aria-expanded="false"
            >
              まとめて保存
            </button>
            <button id="gallery-refresh" type="button" class="small">更新</button>
          </div>

          <section id="bulk" class="bulk" hidden>
            <h2>まとめて保存</h2>
            <p id="bulk-lead"></p>
            <div id="bulk-phone">
              <label class="check">
                <input id="bulk-exclude-mine" type="checkbox" checked />
                自分が送ったものは除く
              </label>
              <p id="bulk-count" class="muted"></p>
            </div>
            <div class="bulk-actions">
              <button id="bulk-start" type="button">準備する</button>
              <button id="bulk-stop" type="button" class="small" hidden>やめる</button>
            </div>
            <p id="bulk-progress" class="muted"></p>
            <p id="bulk-status" class="bulk-status" role="status"></p>
            <ul id="bulk-large" class="bulk-list" hidden></ul>
            <ul id="bulk-zip" class="bulk-list" hidden></ul>
            <p class="bulk-foot">
              <button id="bulk-zip-other" type="button" class="link">
                ZIP でまとめてダウンロード(パソコン向け)
              </button>
              <button id="bulk-reset" type="button" class="link">保存済みの記録を消す</button>
            </p>
          </section>
          <p id="gallery-empty" class="muted" hidden>まだ写真がありません。</p>
          <div id="grid" class="grid"></div>
          <p id="viewer-note" class="viewer-note" role="status"></p>
        </div>
      </section>
    </main>

    <script src="/vendor/tus.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
